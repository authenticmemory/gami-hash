name: gami-hash
arch: amd64
platform: linux
version: __VERSION__
section: utils
priority: optional
maintainer: Authentic Memory <info@authenticmemory.org>
description: |
  Authentic Memory Hashing Tool (formerly GAMI Hash) creates SHA-256 CSV manifests for preservation collections.
  It runs locally, reads source folders without modifying them, and writes
  one CSV manifest plus safety sidecars for resumable runs.
vendor: Authentic Memory
homepage: https://authenticmemory.org
license: MIT
contents:
  - src: ./dist/gami-hash-linux-amd64-gui
    dst: /usr/bin/gami-hash
    file_info:
      mode: 0755
  - src: ./packaging/linux/org.authenticmemory.gamihash.desktop
    dst: /usr/share/applications/org.authenticmemory.gamihash.desktop
    file_info:
      mode: 0644
  - src: ./build/appicon-source.svg
    dst: /usr/share/icons/hicolor/scalable/apps/org.authenticmemory.gamihash.svg
    file_info:
      mode: 0644
  - src: ./packaging/linux/icons/org.authenticmemory.gamihash-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/org.authenticmemory.gamihash.png
    file_info:
      mode: 0644
  - src: ./packaging/linux/icons/org.authenticmemory.gamihash-24.png
    dst: /usr/share/icons/hicolor/24x24/apps/org.authenticmemory.gamihash.png
    file_info:
      mode: 0644
  - src: ./packaging/linux/icons/org.authenticmemory.gamihash-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/org.authenticmemory.gamihash.png
    file_info:
      mode: 0644
  - src: ./packaging/linux/icons/org.authenticmemory.gamihash-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/org.authenticmemory.gamihash.png
    file_info:
      mode: 0644
  - src: ./packaging/linux/icons/org.authenticmemory.gamihash-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/org.authenticmemory.gamihash.png
    file_info:
      mode: 0644
  - src: ./packaging/linux/icons/org.authenticmemory.gamihash-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/org.authenticmemory.gamihash.png
    file_info:
      mode: 0644
  - src: ./packaging/linux/icons/org.authenticmemory.gamihash-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/org.authenticmemory.gamihash.png
    file_info:
      mode: 0644
  - src: ./packaging/linux/icons/org.authenticmemory.gamihash-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/org.authenticmemory.gamihash.png
    file_info:
      mode: 0644
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0
