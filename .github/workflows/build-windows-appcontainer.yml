name: Build signed Windows AppContainer candidate

on:
  push:
    tags:
      - 'test-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Four-part MSIX version ending in .0'
        required: true
        default: '1.6.8.0'
        type: string

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security-checks.yml

  build-sign:
    needs: security
    runs-on: windows-latest
    timeout-minutes: 30
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_PUBLISHER: 'CN=Authentic Memory gemeinnützige UG (haftungsbeschränkt), O=Authentic Memory gemeinnützige UG (haftungsbeschränkt), STREET=Wendelsteinstr. 3, L=Muenchen, S=Bavaria, C=DE, PostalCode=81541'

    steps:
      - uses: actions/checkout@v4

      - name: Resolve MSIX version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $value = '${{ github.ref_name }}' -replace '^test-v', ''
            if ($value -match '^\d+\.\d+\.\d+$') { $value += '.0' }
          } else {
            $value = '${{ inputs.version }}'
          }
          if ($value -notmatch '^\d+\.\d+\.\d+\.0$') { throw "Invalid MSIX version: $value" }
          "value=$value" >> $env:GITHUB_OUTPUT

      - name: Check signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing $name in windows-signing." }
          }

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and validate release-shaped MSIX
        shell: pwsh
        run: |
          ./packaging/windows-appcontainer-webview2/build-package.ps1 `
            -Version '${{ steps.version.outputs.value }}' `
            -Publisher $env:RELEASE_PUBLISHER `
            -Release

      - name: Authenticate to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign and timestamp MSIX
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://neu.codesigning.azure.net
          signing-account-name: authenticmemorysigning
          certificate-profile-name: gami-public-signing
          files: ${{ github.workspace }}\build\bin\windows-appcontainer-webview2\${{ steps.version.outputs.value }}\gami-hash-windows-${{ steps.version.outputs.value }}-x64.msix
          exclude-environment-credential: true

      - name: Verify signature, identity, capabilities, and checksum
        shell: pwsh
        run: |
          $directory = Join-Path $PWD 'build/bin/windows-appcontainer-webview2/${{ steps.version.outputs.value }}'
          $package = Join-Path $directory 'gami-hash-windows-${{ steps.version.outputs.value }}-x64.msix'
          $signature = Get-AuthenticodeSignature -LiteralPath $package
          if ($signature.Status -ne 'Valid') { throw "Invalid MSIX signature: $($signature.StatusMessage)" }
          if ($signature.SignerCertificate.Subject -ne $env:RELEASE_PUBLISHER) { throw 'MSIX signer does not match the manifest publisher.' }
          if (-not $signature.TimeStamperCertificate) { throw 'The release signature has no timestamp.' }

          $manifest = Get-Content -LiteralPath (Join-Path $directory 'unpacked-check/AppxManifest.xml') -Raw
          if ($manifest -match 'runFullTrust|internetClient|internetClientServer|privateNetworkClientServer') {
            throw 'Forbidden capability found in release manifest.'
          }
          if ($manifest -notmatch [regex]::Escape($env:RELEASE_PUBLISHER)) { throw 'Release publisher was not written to the manifest.' }

          $sha256 = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha256  $([IO.Path]::GetFileName($package))" | Set-Content -Encoding ascii (Join-Path $directory 'SHA256SUMS.txt')
          [ordered]@{
            release = $true
            runtimeTested = $false
            version = '${{ steps.version.outputs.value }}'
            package = [IO.Path]::GetFileName($package)
            sha256 = $sha256
            signed = $true
            signerSubject = $signature.SignerCertificate.Subject
            signerThumbprint = $signature.SignerCertificate.Thumbprint
            timeStamperSubject = $signature.TimeStamperCertificate.Subject
            trustLevel = 'appContainer'
            capabilities = @()
            sourceRevision = '${{ github.sha }}'
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $directory 'release-report.json')

      - name: Upload exact signed candidate
        uses: actions/upload-artifact@v4
        with:
          name: gami-hash-windows-appcontainer-${{ steps.version.outputs.value }}
          path: |
            build/bin/windows-appcontainer-webview2/${{ steps.version.outputs.value }}/gami-hash-windows-${{ steps.version.outputs.value }}-x64.msix
            build/bin/windows-appcontainer-webview2/${{ steps.version.outputs.value }}/SHA256SUMS.txt
            build/bin/windows-appcontainer-webview2/${{ steps.version.outputs.value }}/release-report.json
            build/bin/windows-appcontainer-webview2/${{ steps.version.outputs.value }}/RUNBOOK.md
            build/bin/windows-appcontainer-webview2/${{ steps.version.outputs.value }}/inspect-process-tree.ps1
            build/bin/windows-appcontainer-webview2/${{ steps.version.outputs.value }}/collect-sysmon-processes.ps1
          if-no-files-found: error
          retention-days: 14
