name: Build Windows AppContainer candidate

on:
  pull_request:
    paths:
      - '.github/workflows/build-windows-appcontainer.yml'
      - 'frontend/**'
      - 'internal/**'
      - 'packaging/windows-appcontainer/**'
      - 'packaging/windows-appcontainer-webview2/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
  push:
    tags: ['test-v*']

permissions:
  contents: read

jobs:
  security:
    if: startsWith(github.ref, 'refs/tags/test-v')
    uses: ./.github/workflows/security-checks.yml

  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.value }}
    env:
      RELEASE_PUBLISHER: 'CN=Authentic Memory gemeinnützige UG (haftungsbeschränkt), O=Authentic Memory gemeinnützige UG (haftungsbeschränkt), STREET=Wendelsteinstr. 3, L=Muenchen, S=Bavaria, C=DE, PostalCode=81541'
    steps:
      - uses: actions/checkout@v4
      - name: Resolve MSIX version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $value = '${{ github.ref_name }}' -replace '^test-v', ''
            if ($value -match '^\d+\.\d+\.\d+$') { $value += '.0' }
          } else {
            $value = "0.0.${{ github.run_number }}.0"
          }
          if ($value -notmatch '^\d+\.\d+\.\d+\.0$') { throw "Invalid MSIX version: $value" }
          "value=$value" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and validate unsigned MSIX
        shell: pwsh
        run: |
          ./packaging/windows-appcontainer-webview2/build-package.ps1 `
            -Version '${{ steps.version.outputs.value }}' `
            -Publisher $env:RELEASE_PUBLISHER `
            -Release
      - name: Upload validated unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-appcontainer
          path: |
            build/bin/windows-appcontainer-webview2/${{ steps.version.outputs.value }}/gami-hash-windows-${{ steps.version.outputs.value }}-x64.msix
            build/bin/windows-appcontainer-webview2/${{ steps.version.outputs.value }}/unpacked-check/AppxManifest.xml
            build/bin/windows-appcontainer-webview2/${{ steps.version.outputs.value }}/RUNBOOK.md
            build/bin/windows-appcontainer-webview2/${{ steps.version.outputs.value }}/inspect-process-tree.ps1
            build/bin/windows-appcontainer-webview2/${{ steps.version.outputs.value }}/collect-sysmon-processes.ps1
          if-no-files-found: error
          retention-days: 14

  sign:
    if: startsWith(github.ref, 'refs/tags/test-v')
    needs: [security, build]
    runs-on: windows-latest
    timeout-minutes: 15
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_PUBLISHER: 'CN=Authentic Memory gemeinnützige UG (haftungsbeschränkt), O=Authentic Memory gemeinnützige UG (haftungsbeschränkt), STREET=Wendelsteinstr. 3, L=Muenchen, S=Bavaria, C=DE, PostalCode=81541'
    steps:
      - uses: actions/checkout@v4
      - name: Check signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing $name in windows-signing." }
          }
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-windows-appcontainer
          path: candidate
      - name: Authenticate to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign and timestamp MSIX
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://neu.codesigning.azure.net
          signing-account-name: authenticmemorysigning
          certificate-profile-name: gami-public-signing
          files: ${{ github.workspace }}\candidate\gami-hash-windows-${{ needs.build.outputs.version }}-x64.msix
          exclude-environment-credential: true
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Build EXE installer around signed MSIX
        shell: pwsh
        run: |
          ./packaging/windows-appcontainer-webview2/build-installer.ps1 `
            -Package '${{ github.workspace }}\candidate\gami-hash-windows-${{ needs.build.outputs.version }}-x64.msix' `
            -Version '${{ needs.build.outputs.version }}' `
            -OutputDirectory '${{ github.workspace }}\candidate'
      - name: Sign and timestamp EXE installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://neu.codesigning.azure.net
          signing-account-name: authenticmemorysigning
          certificate-profile-name: gami-public-signing
          files: ${{ github.workspace }}\candidate\gami-hash-windows-${{ needs.build.outputs.version }}-x64-installer.exe
          exclude-environment-credential: true
      - name: Verify signed package and create release report
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'candidate/gami-hash-windows-${{ needs.build.outputs.version }}-x64.msix'
          $signature = Get-AuthenticodeSignature -LiteralPath $package
          if ($signature.Status -ne 'Valid') { throw "Invalid MSIX signature: $($signature.StatusMessage)" }
          if ($signature.SignerCertificate.Subject -ne $env:RELEASE_PUBLISHER) { throw 'MSIX signer does not match the manifest publisher.' }
          if (-not $signature.TimeStamperCertificate) { throw 'The release signature has no timestamp.' }
          $installer = Join-Path $PWD 'candidate/gami-hash-windows-${{ needs.build.outputs.version }}-x64-installer.exe'
          $installerSignature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($installerSignature.Status -ne 'Valid') { throw "Invalid installer signature: $($installerSignature.StatusMessage)" }
          if ($installerSignature.SignerCertificate.Subject -ne $env:RELEASE_PUBLISHER) { throw 'EXE installer signer does not match the MSIX publisher.' }
          if (-not $installerSignature.TimeStamperCertificate) { throw 'The EXE installer signature has no timestamp.' }
          $manifest = Get-Content -LiteralPath (Join-Path $PWD 'candidate/unpacked-check/AppxManifest.xml') -Raw
          if ($manifest -match 'runFullTrust|internetClient|internetClientServer|privateNetworkClientServer') { throw 'Forbidden capability found in release manifest.' }
          if ($manifest -notmatch [regex]::Escape($env:RELEASE_PUBLISHER)) { throw 'Release publisher was not written to the manifest.' }
          $sha256 = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerSha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$sha256  $([IO.Path]::GetFileName($package))"
            "$installerSha256  $([IO.Path]::GetFileName($installer))"
          ) | Set-Content -Encoding ascii candidate/SHA256SUMS.txt
          [ordered]@{
            release = $true; runtimeTested = $false; version = '${{ needs.build.outputs.version }}'
            package = [IO.Path]::GetFileName($package); sha256 = $sha256; signed = $true
            signerSubject = $signature.SignerCertificate.Subject
            signerThumbprint = $signature.SignerCertificate.Thumbprint
            timeStamperSubject = $signature.TimeStamperCertificate.Subject
            installer = [IO.Path]::GetFileName($installer); installerSha256 = $installerSha256
            trustLevel = 'appContainer'; capabilities = @(); sourceRevision = '${{ github.sha }}'
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 candidate/release-report.json
      - name: Upload exact signed candidate
        uses: actions/upload-artifact@v4
        with:
          name: gami-hash-windows-appcontainer-${{ needs.build.outputs.version }}
          path: |
            candidate/gami-hash-windows-${{ needs.build.outputs.version }}-x64.msix
            candidate/gami-hash-windows-${{ needs.build.outputs.version }}-x64-installer.exe
            candidate/SHA256SUMS.txt
            candidate/release-report.json
            candidate/RUNBOOK.md
            candidate/inspect-process-tree.ps1
            candidate/collect-sysmon-processes.ps1
          if-no-files-found: error
          retention-days: 14
