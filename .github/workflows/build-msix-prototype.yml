name: Build MSIX prototype

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Prototype package version (four parts; final part 0)'
        type: string
        default: '1.0.0.0'
        required: true

permissions:
  contents: read

jobs:
  prototype:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build and validate unsigned MSIX
        shell: pwsh
        env:
          MSIX_VERSION: ${{ inputs.version }}
        run: ./build-msix.ps1 -Version $env:MSIX_VERSION
      - name: Run Go tests
        run: go test -count=1 -timeout=5m ./...
      - name: Upload prototype (not for public installation)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gami-hash-msix-unsigned-prototype
          path: |
            build/bin/msix-prototype/**/*.msix
            build/bin/msix-prototype/**/SHA256SUMS.txt
            build/bin/msix-prototype/**/build-report.json
          if-no-files-found: error
          retention-days: 14
