name: Build AppContainer storage broker spike

on:
  push:
    tags: ['test-v*-broker-spike']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.value }}
    env:
      RELEASE_PUBLISHER: 'CN=Authentic Memory gemeinnÃ¼tzige UG (haftungsbeschrÃ¤nkt), O=Authentic Memory gemeinnÃ¼tzige UG (haftungsbeschrÃ¤nkt), STREET=Wendelsteinstr. 3, L=Muenchen, S=Bavaria, C=DE, PostalCode=81541'
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $value = '${{ github.ref_name }}' -replace '^test-v', '' -replace '-broker-spike$', ''
          if ($value -match '^\d+\.\d+\.\d+$') { $value += '.0' }
          if ($value -notmatch '^\d+\.\d+\.\d+\.0$') { throw "Invalid version: $value" }
          "value=$value" >> $env:GITHUB_OUTPUT
      - name: Build and validate networkless spike
        shell: pwsh
        run: |
          ./packaging/appcontainer-storage-broker-spike/build-spike.ps1 `
            -Version '${{ steps.version.outputs.value }}' `
            -Publisher $env:RELEASE_PUBLISHER
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-storage-broker-spike
          path: build/bin/appcontainer-storage-broker-spike/${{ steps.version.outputs.value }}
          retention-days: 7

  sign:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_PUBLISHER: 'CN=Authentic Memory gemeinnÃ¼tzige UG (haftungsbeschrÃ¤nkt), O=Authentic Memory gemeinnÃ¼tzige UG (haftungsbeschrÃ¤nkt), STREET=Wendelsteinstr. 3, L=Muenchen, S=Bavaria, C=DE, PostalCode=81541'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-storage-broker-spike
          path: candidate
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign and timestamp spike
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://neu.codesigning.azure.net
          signing-account-name: authenticmemorysigning
          certificate-profile-name: gami-public-signing
          files: ${{ github.workspace }}\candidate\gami-storage-broker-spike-${{ needs.build.outputs.version }}-x64.msix
          exclude-environment-credential: true
      - name: Verify exact package
        shell: pwsh
        run: |
          $package = '${{ github.workspace }}\candidate\gami-storage-broker-spike-${{ needs.build.outputs.version }}-x64.msix'
          $signature = Get-AuthenticodeSignature -LiteralPath $package
          if ($signature.Status -ne 'Valid') { throw "Invalid signature: $($signature.StatusMessage)" }
          if ($signature.SignerCertificate.Subject -ne $env:RELEASE_PUBLISHER) { throw 'Signer mismatch' }
          if (-not $signature.TimeStamperCertificate) { throw 'Missing timestamp' }
          $manifest = Get-Content -LiteralPath '${{ github.workspace }}\candidate\unpacked-check\AppxManifest.xml' -Raw
          if ($manifest -match 'runFullTrust|internetClient|internetClientServer|privateNetworkClientServer') { throw 'Forbidden capability' }
          (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -Encoding ascii '${{ github.workspace }}\candidate\SHA256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: signed-storage-broker-spike-${{ needs.build.outputs.version }}
          path: |
            candidate/gami-storage-broker-spike-${{ needs.build.outputs.version }}-x64.msix
            candidate/SHA256.txt
            candidate/unpacked-check/AppxManifest.xml
          retention-days: 7
