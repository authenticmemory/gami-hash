name: Build signed Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "test-v*"
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    environment: windows-signing
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "Set $name in the windows-signing GitHub environment. See docs/windows-signing.md."
            }
          }

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Run Go tests
        run: go test -count=1 -timeout=5m ./...

      - name: Run frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build NSIS installer
        shell: pwsh
        env:
          BUILD_VERSION: ${{ github.ref_name }}
        run: .\build-windows-installer.ps1 -Version $env:BUILD_VERSION -InstallScope user

      - name: Authenticate to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign GUI and CLI payloads
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://neu.codesigning.azure.net
          signing-account-name: authenticmemorysigning
          certificate-profile-name: gami-public-signing
          files: |
            ${{ github.workspace }}\build\bin\gami-hash.exe
            ${{ github.workspace }}\build\windows\installer\gami-hash-cli.exe
          exclude-environment-credential: true

      - name: Package verified signed payloads
        shell: pwsh
        run: .\package-signed-windows-installer.ps1

      - name: Sign finished installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://neu.codesigning.azure.net
          signing-account-name: authenticmemorysigning
          certificate-profile-name: gami-public-signing
          files-folder: ${{ github.workspace }}\build\bin
          files-folder-filter: '*-installer.exe'
          exclude-environment-credential: true

      - name: Verify release signatures and timestamps
        shell: pwsh
        run: .\verify-windows-signatures.ps1 -Stage All

      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem build/bin -File |
            Where-Object { $_.Extension -eq ".exe" } |
            ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              "$($hash.Hash.ToLower())  $($_.Name)"
            } | Set-Content -Encoding ascii build/bin/SHA256SUMS-windows.txt

      - name: Create dependency inventory
        shell: pwsh
        run: .\release-dependency-inventory.ps1

      - name: Upload signed Windows build
        uses: actions/upload-artifact@v4
        with:
          name: gami-hash-windows
          path: |
            build/bin/*.exe
            build/bin/SHA256SUMS-windows.txt
            build/release-metadata/*
          if-no-files-found: error
          retention-days: 14
