name: Build signed Windows installer

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (e.g. test-v0.1.4 or v1.0.0)'
        required: true
        default: test-v0.1.4
        type: string
  push:
    tags:
      - "test-v*"

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security-checks.yml

  build-windows:
    needs: security
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    environment: windows-signing
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "Set $name in the windows-signing GitHub environment. See docs/windows-signing.md."
            }
          }

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node.js for legacy-platform Go tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      # The root Go package still embeds these assets for Linux/macOS Wails
      # builds. Windows does not package them, but clean-checkout Go tests need
      # the generated directory to compile the shared package.
      - name: Build legacy-platform frontend test assets
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build

      - name: Run Go tests
        run: go test -count=1 -timeout=5m ./...

      - name: Build NSIS installer
        shell: pwsh
        env:
          BUILD_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: .\build-windows-installer.ps1 -Version $env:BUILD_VERSION

      - name: Authenticate to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign GUI and worker payloads
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://neu.codesigning.azure.net
          signing-account-name: authenticmemorysigning
          certificate-profile-name: gami-public-signing
          files: |
            ${{ github.workspace }}\build\windows-native\payload\GamiHash.exe
            ${{ github.workspace }}\build\windows-native\payload\GamiHashEngine.exe
          exclude-environment-credential: true

      - name: Package verified signed payloads
        shell: pwsh
        env:
          BUILD_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: .\package-signed-windows-installer.ps1 -Version $env:BUILD_VERSION

      - name: Sign finished installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://neu.codesigning.azure.net
          signing-account-name: authenticmemorysigning
          certificate-profile-name: gami-public-signing
          files-folder: ${{ github.workspace }}\build\bin
          files-folder-filter: '*-installer.exe'
          exclude-environment-credential: true

      - name: Verify release signatures and timestamps
        shell: pwsh
        run: .\verify-windows-signatures.ps1 -Stage All

      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem build/bin -File |
            Where-Object { $_.Extension -eq ".exe" } |
            ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              "$($hash.Hash.ToLower())  $($_.Name)"
            } | Set-Content -Encoding ascii build/bin/SHA256SUMS-windows.txt

      - name: Record signed artifact identity
        shell: pwsh
        env:
          BUILD_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: .\write-windows-release-report.ps1 -Version $env:BUILD_VERSION -Commit $env:GITHUB_SHA

      - name: Create dependency inventory
        shell: pwsh
        run: .\release-dependency-inventory.ps1

      - name: Upload signed Windows build
        uses: actions/upload-artifact@v4
        with:
          name: gami-hash-windows
          path: |
            build/bin/*.exe
            build/bin/SHA256SUMS-windows.txt
            build/release-metadata/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/test-v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: gami-hash-windows
          path: release
      - name: Create durable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || {
              echo "Refusing to replace assets on a published release" >&2
              exit 1
            }
          else
            flags=(--draft --verify-tag --generate-notes)
            if [[ "$RELEASE_TAG" == test-v* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${flags[@]}"
          fi
          mapfile -d '' assets < <(find release -type f -print0)
          test "${#assets[@]}" -gt 0
          # A candidate tag names one immutable byte sequence. If assets already
          # exist, fail instead of silently replacing the artifact that may
          # already be under acceptance testing.
          gh release upload "$RELEASE_TAG" "${assets[@]}"
