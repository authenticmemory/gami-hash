name: Publish signed downloads

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-hash-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require a stable version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
  windows:
    needs: validate
    runs-on: windows-latest
    permissions:
      # Candidate builds are intentionally held as draft releases until
      # acceptance. Reading a draft release through the GitHub API requires
      # contents: write even though this job does not modify the candidate.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Promote the accepted immutable Windows candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ github.ref_name }}
        run: |
          $candidateTag = "test-$env:STABLE_TAG"
          $stableCommit = git rev-list -n 1 $env:STABLE_TAG
          git fetch --no-tags origin "refs/tags/${candidateTag}:refs/tags/${candidateTag}"
          if ($LASTEXITCODE -ne 0) { throw "Missing candidate tag: $candidateTag" }
          $candidateCommit = git rev-list -n 1 $candidateTag 2>$null
          if (-not $candidateCommit) { throw "Missing candidate tag: $candidateTag" }
          if ($candidateCommit -ne $stableCommit) { throw "$candidateTag and $env:STABLE_TAG must reference the same commit." }
          New-Item -ItemType Directory -Force release/windows/bin,release/windows/release-metadata | Out-Null
          gh release download $candidateTag --pattern 'gami-hash-windows-*-x64-installer.exe' --pattern 'SHA256SUMS-windows.txt' --dir release/windows/bin
          gh release download $candidateTag --pattern 'windows-release-report.json' --dir release/windows/release-metadata
          if ($LASTEXITCODE -ne 0) { throw "Failed to download immutable candidate $candidateTag" }
          $installer = @(Get-ChildItem release/windows/bin/gami-hash-windows-*-x64-installer.exe)
          if ($installer.Count -ne 1) { throw "Expected one candidate installer; found $($installer.Count)." }
          $report = Get-Content -Raw release/windows/release-metadata/windows-release-report.json | ConvertFrom-Json
          if ($report.commit -ne $stableCommit) { throw 'Candidate report commit does not match the stable tag.' }
          $record = @($report.files | Where-Object name -eq $installer[0].Name)
          if ($record.Count -ne 1) { throw 'Candidate installer is absent from its release report.' }
          $actual = (Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $record[0].sha256) { throw 'Candidate installer hash does not match its release report.' }
          $line = Get-Content release/windows/bin/SHA256SUMS-windows.txt | Where-Object { $_ -match [regex]::Escape($installer[0].Name) }
          if (-not $line -or $line.Split(' ',[System.StringSplitOptions]::RemoveEmptyEntries)[0] -ne $actual) { throw 'Candidate checksum file does not match the installer.' }
          $signature = Get-AuthenticodeSignature $installer[0].FullName
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) { throw 'Candidate installer signature or timestamp is invalid.' }
      - uses: actions/upload-artifact@v4
        with:
          name: gami-hash-windows
          path: release/windows
          if-no-files-found: error
          retention-days: 14
  linux:
    needs: validate
    uses: ./.github/workflows/build-linux-cli.yml
    secrets: inherit
  linux-gui:
    needs: validate
    uses: ./.github/workflows/build-linux-gui.yml
    secrets: inherit
  publish:
    needs: [windows, linux, linux-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: gami-hash-windows
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: gami-hash-linux-cli
          path: release/linux
      - uses: actions/download-artifact@v4
        with:
          name: gami-hash-linux-gui
          path: release/linux-gui
      - name: Assemble checked release manifest
        run: |
          node --test scripts/create-download-manifest.test.mjs
          node scripts/create-download-manifest.mjs
          tar -czf release/downloads/windows-release-metadata.tar.gz -C release/windows release-metadata
          tar -czf release/downloads/linux-release-metadata.tar.gz -C release/linux release-metadata
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes
          fi
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true || { echo 'Refusing to replace a published release'; exit 1; }
          gh release upload "$GITHUB_REF_NAME" release/downloads/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Request website deployment
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Set WEBSITE_DISPATCH_TOKEN in repository secrets'; exit 1; }
          gh api --method POST repos/authenticmemory/AuthenticMemory_Website/dispatches -f event_type=tool-release
