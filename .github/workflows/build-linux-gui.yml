name: Build Linux GUI

on:
  workflow_dispatch:
  push:
    tags:
      - "test-v*"

permissions:
  contents: read

jobs:
  build-linux-gui:
    name: Build Linux GUI tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux Wails dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets for Go embed
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.1

      - name: Run tests
        run: go test -count=1 -timeout=5m ./...

      - name: Build Linux GUI
        run: |
          version="${GITHUB_REF_NAME:-dev}"
          "$HOME/go/bin/wails" build \
            -clean \
            -tags "desktop,production,webkit2_41" \
            -ldflags "-w -s -buildid= -X github.com/authenticmemory/gami-hash/internal/engine.Version=$version"

      - name: Package Linux GUI
        run: |
          mkdir -p dist
          cp build/bin/gami-hash dist/gami-hash-linux-amd64-gui
          chmod 0755 dist/gami-hash-linux-amd64-gui
          tar -C dist -czf dist/gami-hash-linux-amd64-gui.tar.gz gami-hash-linux-amd64-gui

      - name: Build Linux packages
        run: |
          version="${GITHUB_REF_NAME:-0.0.0-dev}"
          version="${version#v}"
          version="${version#test-v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}([~+.-][0-9A-Za-z.~+-]+)?$'; then
            version="0.0.0-dev"
          fi
          sed "s/__VERSION__/$version/g" packaging/linux/nfpm.deb.yaml > dist/nfpm.deb.yaml
          sed "s/__VERSION__/$version/g" packaging/linux/nfpm.rpm-fedora.yaml > dist/nfpm.rpm-fedora.yaml
          "$HOME/go/bin/nfpm" package --config dist/nfpm.deb.yaml --packager deb --target dist/
          "$HOME/go/bin/nfpm" package --config dist/nfpm.rpm-fedora.yaml --packager rpm --target dist/

      - name: Write checksums
        run: |
          cd dist
          sha256sum \
            gami-hash-linux-amd64-gui.tar.gz \
            gami-hash_*_amd64.deb \
            gami-hash-*.x86_64.rpm \
            > SHA256SUMS-linux-gui.txt

      - name: Upload Linux GUI
        uses: actions/upload-artifact@v4
        with:
          name: gami-hash-linux-gui
          path: |
            dist/gami-hash-linux-amd64-gui.tar.gz
            dist/gami-hash_*_amd64.deb
            dist/gami-hash-*.x86_64.rpm
            dist/SHA256SUMS-linux-gui.txt
          if-no-files-found: error
          retention-days: 14
